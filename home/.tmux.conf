# Remove date and time from status bar
set -g status-right '#H'

set -g prefix C-s

# 'C-s C-s' sends an actual 'C-s' through to the application.
bind C-s send-prefix

# Time tmux waits while intercepting escape key.
set -sg escape-time 0

# Time tmux waits for repeated commands.
# e.g. "C-s right right" to switch across two panes.
# This only ever gets in the way for me.
set -g repeat-time 0

# True colour and italics inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# bind = and - to horizontal & vertical split; they look like what they do.
unbind '"' # " is default vertical split binding
unbind %   # % is default horizontal split binding
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h   if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j   if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k   if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l   if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Same pane navigation once copy mode has taken over the root key table.
bind-key -T copy-mode-vi C-h   select-pane -L
bind-key -T copy-mode-vi C-j   select-pane -D
bind-key -T copy-mode-vi C-k   select-pane -U
bind-key -T copy-mode-vi C-l   select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Clear screen, displaced by the C-l pane binding above.
bind C-l send-keys C-l

# vim
setw -g mode-keys vi
bind [ copy-mode
bind ] paste-buffer

bind-key -T copy-mode-vi v   send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y   send -X copy-pipe-and-cancel 'xsel -ib'
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear 'xsel -ib'

# Export copies over OSC 52, for terminals with no reachable X display.
set -g set-clipboard on

# buffer
bind Space choose-buffer -Z

# Persistently sort sessions alphabetically by name
bind s choose-tree -sZ -O name

# Scroll back buffer
set-option -g history-limit 10000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off

set -g detach-on-destroy off

# enable mouse
set -g mouse on
set -g focus-events on


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Restored on top of the default list (editors, pagers, top, ...).
set -g @resurrect-processes 'ssh claude'

# for vim
set -g @resurrect-strategy-vim 'central'
# for neovim
set -g @resurrect-strategy-nvim 'central'

set -g @continuum-restore 'on'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
